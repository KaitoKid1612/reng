name: Validate daily listening banks

on:
  push:
    branches:
      - feat/daily-listening-settings-20261107
    paths:
      - 'content/review-banks/**'
      - 'content/listening/**'
      - 'tests/daily-listening-review-banks.test.ts'
      - '.github/workflows/daily-listening-banks.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx --test tests/daily-listening-review-banks.test.ts
